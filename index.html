<!doctype html>
<html lang="en" data-theme="bully">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>i am habit</title>
  <meta name="description" content="A personal habit tracker that works offline.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone home-screen app: full screen, content runs under the status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="i am habit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Apply the saved look before the first paint, so the page never flashes the wrong one -->
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('dawn-habits')).settings.theme || 'bully'; } catch {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today">Today</a>
    <a href="#week" data-tab="week">Week</a>
    <a href="#stats" data-tab="stats">Progress</a>
    <a href="#habits" data-tab="habits">Habits</a>
  </nav>

  <dialog id="sheet" aria-label="Habit details"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
