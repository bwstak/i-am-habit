<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dawn</title>
  <meta name="description" content="A personal habit tracker that works offline.">
  <meta name="theme-color" content="#0e1030">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone home-screen app: full screen, content runs under the status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dawn">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.6 2.6 5-5.2"/></svg>
      <span>Today</span></a>
    <a href="#week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Week</span></a>
    <a href="#stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 20v-7M12 20V5M18.5 20v-10"/></svg>
      <span>Progress</span></a>
    <a href="#habits" data-tab="habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      <span>Habits</span></a>
  </nav>

  <dialog id="sheet" aria-label="Habit details"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
